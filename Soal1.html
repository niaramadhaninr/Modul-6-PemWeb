<!DOCTYPE html>
<html>
<head>
    <title>103092400071_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body onload="mulai()">
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script type="text/javascript">
   function inputNama() {
       return prompt("Masukkan nama kamu:");
   }

   function inputNim() {
       return prompt("Masukkan nim kamu:");
   }

   function tampilkan(nama, nim) {
       if (nama !== null) {
           document.getElementById("nama").value = nama;
       }
       if (nim !== null) {
           document.getElementById("nim").value = nim;
       }
   }

   function mulai() {
       var nama = inputNama();
       var nim = inputNim();
       tampilkan(nama, nim);
   }
    </script>

</body>
</html>
